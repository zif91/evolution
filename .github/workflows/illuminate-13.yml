name: Illuminate 13 compatibility
on:
  push:
    branches: [upgrade/illuminate-13]
  pull_request:
    branches: [3.1.x, upgrade/illuminate-13]
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_ROOT_HOST: '%'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, gd, mbstring, xml, zip, curl, iconv
          tools: composer:v2
          coverage: none
      - name: Install isolated demo with pinned extras
        env:
          EVO_TEST_DB_HOST: 127.0.0.1
          EVO_TEST_DB_ACCOUNT_HOST: '%'
        run: python3 tools/setup-local.py
      - name: Run compatibility and console tests
        run: python3 tests/run.py
      - name: Check installed platform requirements
        run: composer check-platform-reqs --working-dir=core
      - name: Check HTTP frontend
        run: |
          php -S 127.0.0.1:8133 tools/dev-router.php > .local/server.log 2>&1 &
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8133/ > .local/home.html; then break; fi
            sleep 1
          done
          grep -F 'Legacy plugin OnWebPagePrerender: OK' .local/home.html
          grep -F 'Evolution CMS on Laravel 13' .local/home.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compatibility-php-${{ matrix.php }}
          path: |
            reports/test-run.json
            reports/compatibility.json
